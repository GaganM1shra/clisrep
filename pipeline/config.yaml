---
# CLISREP Analysis Pipeline Configuration
# Edit this file to configure data sources, analysis parameters, and output settings

pipeline:
  name: "CLISREP Phase 1 Analysis"
  version: "1.0.0"
  output_dir: "../data/analyzed"
  kg_output_dir: "../knowledge-graph"
  dashboard_output: "../dashboard.html"

data_sources:
  jira:
    enabled: true
    project: "CLI"
    issue_type: "ESR"
    lookback_days: 180
    cloud_id: "harness.atlassian.net"
    raw_output: "../data/raw/jira/cli-esr-issues.json"

  slack:
    enabled: true
    channel: "all-cloud-engineers"
    raw_output: "../data/raw/slack/all-cloud-engineers.json"

analysis:
  request_categories:
    # Pattern-based categorization rules
    # Each category has patterns that match against summary + description text
    categories:
      database_mongodb:
        patterns: ["mongo", "collection", "replicaset", "mongos", "sharding"]
        label: "MongoDB Operations"
      database_postgres:
        patterns: ["postgres", "pg[\\s\\-_]", "cloudsql", "alloydb", "migration.*dirty", "analyticsdb"]
        label: "PostgreSQL Operations"
      secrets_certificates:
        patterns: ["secret", "certificate", "cert\\b", "tls", "ssl", "token", "credential", "service.?account"]
        label: "Secrets & Certificates"
      observability:
        patterns: ["metric", "grafana", "dashboard", "alert", "monitor", "mimir", "prometheus", "loki", "observ"]
        label: "Observability & Monitoring"
      deployment_release:
        patterns: ["deploy", "restart", "rollback", "helm", "argocd", "rollout", "release", "publish.*image"]
        label: "Deployment & Release"
      networking_dns:
        patterns: ["dns", "vanity.*url", "ingress", "load.?balancer", "\\blb\\b", "vpc", "gclb", "domain"]
        label: "Networking & DNS"
      kubernetes_infra:
        patterns: ["\\bpod\\b", "namespace", "cluster\\b", "\\beks\\b", "\\bgke\\b", "k8s", "kube"]
        label: "Kubernetes & Cluster"
      kafka_messaging:
        patterns: ["kafka", "outbox", "topic\\b", "consumer", "producer"]
        label: "Kafka & Messaging"
      scaling_resources:
        patterns: ["scale\\b", "resize", "increase.*(?:cpu|mem|disk)", "bump.*(?:cpu|mem)", "quota", "downsize"]
        label: "Scaling & Resources"
      access_permissions:
        patterns: ["access", "permission", "rbac", "iam", "role\\b"]
        label: "Access & Permissions"
      troubleshooting:
        patterns: ["investigat", "debug", "\\bwhy\\b", "stuck\\b", "broken", "crash", "oom", "timeout"]
        label: "Troubleshooting"
      environment_setup:
        patterns: ["account.*creat", "onboard", "new.*(?:env|cluster|project)", "setup\\b", "prepare.*infra"]
        label: "Environment Setup"

  automation_feasibility:
    high_patterns: ["unblock.*outbox", "vanity.*url", "scale.*disk", "restart", "bump.*cpu", "increase.*timeout", "copy.*image", "update.*plugin", "create.*secret", "grafana.*access"]
    medium_patterns: ["add.*label", "upgrade.*instance", "create.*alert", "backfill", "deploy", "service.?account"]
    low_patterns: ["investigat", "debug", "why", "stuck", "help.*understand", "migration.*dirty"]

dashboard:
  title: "CLISREP Phase 1 - Cloud Engineering Workload Analysis"
  subtitle: "CLI ESR Tickets & Slack Channel Analysis (Feb-Aug 2026)"
  theme: "dark"
